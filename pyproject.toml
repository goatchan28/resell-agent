[project]
name = "resell"
version = "0.1.0"
description = "Personal AI reselling agent: photos + cost -> researched eBay listing"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

# Flask is an extra, not a dependency. The CLI is the reference front end and has
# to keep working on a machine where the UI was never installed -- which is also
# what stops the read models in views.py from quietly acquiring a Flask import.
[project.optional-dependencies]
ui = [
    "flask>=3.0",
]
# The private beta host. Waitress rather than gunicorn: pure Python, no fork or
# preload behaviour to reason about on macOS, and single-process-with-threads is
# exactly the shape this app needs -- agent runs live on background threads in
# the same process, and `recover_interrupted_runs` assumes at startup that a
# `running` row means a process that has died. A second worker would make that
# assumption false.
beta = [
    "flask>=3.0",
    "waitress>=3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "flask>=3.0",
]

[project.scripts]
resell = "resell.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/resell"]

[tool.pytest.ini_options]
# "." puts the repository root on sys.path so `tests.` imports resolve.
# `python -m pytest` adds the working directory implicitly and the console script
# does not, so without this the documented `uv run pytest` failed collection while
# `python -m pytest` passed -- two commands, two different answers.
pythonpath = ["src", "."]
testpaths = ["tests"]
