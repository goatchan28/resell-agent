[project]
name = "resell"
version = "0.1.0"
description = "Personal AI reselling agent: photos + cost -> researched eBay listing"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[project.scripts]
resell = "resell.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/resell"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
