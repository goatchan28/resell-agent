[project]
name = "resell"
version = "0.1.0"
description = "Personal AI reselling agent: photos + cost -> researched eBay listing"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

# Flask is an extra, not a dependency. The CLI is the reference front end and has
# to keep working on a machine where the UI was never installed -- which is also
# what stops the read models in views.py from quietly acquiring a Flask import.
[project.optional-dependencies]
ui = [
    "flask>=3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "flask>=3.0",
]

[project.scripts]
resell = "resell.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/resell"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
